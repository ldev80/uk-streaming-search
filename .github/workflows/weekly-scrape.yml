name: Weekly Scrape

on:
  schedule:
    - cron: '0 2 * * 0'  # Sunday 2:00 UTC (3:00 BST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 playwright
          playwright install chromium --with-deps

      - name: Run scraper
        run: python scrape_catalogue.py

      - name: Prepare public files
        run: |
          cp catalogue.json public/catalogue.json
          cp index.html public/index.html
          [ -f new_titles.json ] && cp new_titles.json public/new_titles.json || true
          [ -f new_this_week.json ] && cp new_this_week.json public/new_this_week.json || true

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogue.db catalogue.json public/catalogue.json public/index.html
          [ -f new_titles.json ] && git add new_titles.json public/new_titles.json || true
          [ -f new_this_week.json ] && git add new_this_week.json public/new_this_week.json || true
          git diff --cached --quiet && echo "No changes to catalogue" && exit 0
          git commit -m "Update catalogue — $(date -u '+%Y-%m-%d')"
          git pull --rebase
          git push

