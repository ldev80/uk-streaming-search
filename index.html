<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TVSearch UK — Freely streaming films and shows in the UK | tvsearch.uk</title>
<meta name="description" content="Search 23,000+ programmes across 13 free UK streaming services including BBC iPlayer, ITVX, Channel 4, Channel 5, STV Player, Pluto TV, Tubi, Rakuten TV and more.">
<meta name="keywords" content="free streaming UK, watch free TV, BBC iPlayer search, ITVX, Channel 4, free movies UK, free TV shows, streaming search engine">
<link rel="canonical" href="https://tvsearch.uk/">
<meta property="og:type" content="website">
<meta property="og:title" content="UK Free Streaming Search">
<meta property="og:description" content="Search 23,000+ programmes across 13 free UK streaming services. Find what to watch — instantly.">
<meta property="og:url" content="https://tvsearch.uk/">
<meta property="og:site_name" content="tvsearch.uk">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="UK Free Streaming Search">
<meta name="twitter:description" content="Search 23,000+ programmes across 13 free UK streaming services. Find what to watch — instantly.">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#2b2b35">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "UK Free Streaming Search",
  "url": "https://tvsearch.uk/",
  "description": "Search 23,000+ programmes across 13 free UK streaming services including BBC iPlayer, ITVX, Channel 4, Channel 5, STV Player, Pluto TV, Tubi, Rakuten TV and more.",
  "applicationCategory": "EntertainmentApplication",
  "operatingSystem": "Any",
  "offers": { "@type": "Offer", "price": "0", "priceCurrency": "GBP" }
}
</script>
<style>
@font-face {
    font-family: 'Open Sans';
    font-style: normal;
    font-weight: 400 700;
    font-stretch: 100%;
    font-display: swap;
    src: url('fonts/open-sans.woff2') format('woff2');
}

:root {
    --bg: #2b2b35;
    --text: #f4f4ea;
    --accent: #ea714b;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Open Sans', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
}

.container {
    max-width: 400px;
    margin: 0 auto;
    padding: 2rem 1.5rem;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    transition: padding-top 0.35s ease;
}

.container.landing {
    padding-top: 28vh;
}

header {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 64px;
}

.landing header {
    margin-bottom: 64px;
}

header img.logo {
    height: 50px;
    width: auto;
    flex-shrink: 0;
}

header p {
    color: var(--text);
    font-size: 0.9rem;
    margin-left: auto;
    text-align: right;
}

.search-area {
    margin-bottom: 1.5rem;
}

.landing .new-this-week,
.landing #results {
    display: none;
}

.search-box {
    position: relative;
}

.search-box input {
    width: 100%;
    padding: 1rem 1.2rem 1rem 3rem;
    font-family: 'Open Sans', sans-serif;
    font-size: 1.1rem;
    background: var(--bg);
    border: none;
    border-bottom: 1px solid var(--text);
    border-radius: 0;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
}

.search-box input:focus {
    border-bottom-color: var(--accent);
}

.search-box input::placeholder { color: var(--text); opacity: 0.5; }

.search-box .icon {
    position: absolute;
    left: 1rem;
    top: 50%;
    transform: translateY(-50%);
    font-size: 1.2rem;
    color: var(--text);
    pointer-events: none;
}

.search-box .clear-btn {
    position: absolute;
    right: 0.8rem;
    top: 50%;
    transform: translateY(-50%);
    background: var(--text);
    border: none;
    color: var(--bg);
    font-size: 0.85rem;
    padding: 0.3rem 0.6rem;
    border-radius: 6px;
    cursor: pointer;
    display: none;
    font-family: 'Open Sans', sans-serif;
}

.service-logos {
    display: flex;
    flex-wrap: wrap;
    gap: 1.2rem;
    justify-content: center;
    align-items: center;
    padding: 0.5rem 0;
    margin-bottom: 1rem;
}

.service-logos img {
    height: 22px;
    width: auto;
    max-width: 33px;
    object-fit: contain;
    filter: brightness(0) invert(1);
}

.svc-logo {
    height: 16px;
    width: auto;
    vertical-align: middle;
    flex-shrink: 0;
}

.service-header .svc-logo {
    height: 18px;
}

.results-count {
    font-family: 'Open Sans', sans-serif;
    font-size: 0.85rem;
    color: var(--text);
    margin-bottom: 1rem;
    padding-left: 0.2rem;
}

.no-results {
    text-align: center;
    padding: 3rem;
    color: var(--text);
    font-size: 1rem;
}

.service-group {
    margin-bottom: 1.5rem;
}

.service-header {
    font-family: 'Open Sans', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--text);
    padding: 0.5rem 0;
    margin-bottom: 0.5rem;
    border-bottom: 1px solid var(--text);
}

.result-card {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 0.8rem;
    background: var(--bg);
    border: 1px solid var(--text);
    border-radius: 10px;
    margin-bottom: 0.5rem;
    text-decoration: none;
    color: inherit;
    transition: all 0.15s;
}

.result-card:hover {
    border-color: var(--accent);
    transform: translateX(2px);
}

.card-image {
    width: 64px;
    height: 48px;
    border-radius: 6px;
    overflow: hidden;
    background: var(--bg);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
}

.card-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.card-body {
    flex: 1;
    min-width: 0;
}

.card-title {
    font-weight: 600;
    font-size: 0.95rem;
    margin-bottom: 0.2rem;
}

.card-title mark {
    background: none;
    color: var(--accent);
    border-radius: 2px;
    padding: 0 2px;
}

.card-desc {
    font-size: 0.8rem;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.card-arrow {
    color: var(--text);
    font-size: 1.2rem;
    flex-shrink: 0;
    transition: transform 0.15s;
}

.result-card:hover .card-arrow {
    transform: translateX(3px);
    color: var(--accent);
}

.alert-section {
    display: none;
}

.alert-heading {
    font-size: 0.9rem;
    font-weight: 600;
    margin-bottom: 0.8rem;
    color: var(--text);
}

.alert-form {
    display: flex;
    gap: 0.5rem;
}

.alert-form input {
    flex: 1;
    padding: 0.6rem 0.8rem;
    font-family: 'Open Sans', sans-serif;
    font-size: 0.85rem;
    background: var(--bg);
    border: 1px solid var(--text);
    border-radius: 8px;
    color: var(--text);
    outline: none;
    min-width: 0;
}

.alert-form input:focus {
    border-color: var(--accent);
}

.alert-form input::placeholder { color: var(--text); opacity: 0.5; }

.alert-form button {
    padding: 0.6rem 1.2rem;
    font-family: 'Open Sans', sans-serif;
    font-size: 0.85rem;
    background: var(--accent);
    color: var(--bg);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    white-space: nowrap;
}

.alert-form button:disabled { opacity: 0.5; cursor: default; }

.alert-subtext {
    font-size: 0.75rem;
    color: var(--text);
    margin-top: 0.6rem;
}

.alert-msg {
    font-size: 0.85rem;
    margin-top: 0.6rem;
}

.alert-msg.ok { color: var(--text); }
.alert-msg.err { color: var(--accent); }

.footer {
    text-align: center;
    color: var(--text);
    font-size: 0.8rem;
}

.landing .footer {
    margin-top: 0;
}

.footer kbd {
    font-family: 'Open Sans', sans-serif;
    background: var(--bg);
    border: 1px solid var(--text);
    border-radius: 4px;
    padding: 0.15rem 0.4rem;
    font-size: 0.75rem;
}

.loading {
    text-align: center;
    padding: 3rem;
    color: var(--text);
}

.loading .spinner {
    display: inline-block;
    width: 24px;
    height: 24px;
    border: 2px solid var(--text);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    margin-bottom: 0.5rem;
}

@keyframes spin { to { transform: rotate(360deg); } }

.new-this-week {
    display: none;
    margin-bottom: 2rem;
}

.new-this-week h2 {
    font-size: 0.95rem;
    font-weight: 700;
    margin-bottom: 0.8rem;
    color: var(--text);
}

.new-scroll {
    display: flex;
    gap: 0.8rem;
    overflow-x: auto;
    padding-bottom: 0.5rem;
    scrollbar-width: thin;
    scrollbar-color: var(--text) transparent;
    -webkit-overflow-scrolling: touch;
}

.new-card {
    flex: 0 0 160px;
    text-decoration: none;
    color: inherit;
    transition: transform 0.15s;
}

.new-card:hover { transform: translateY(-3px); }

.new-poster {
    width: 160px;
    height: 90px;
    border-radius: 8px;
    overflow: hidden;
    background: var(--bg);
    border: 1px solid var(--text);
}

.new-poster img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.new-title {
    font-size: 0.8rem;
    font-weight: 600;
    margin-top: 0.4rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.new-service {
    font-size: 0.7rem;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 0.3rem;
    margin-top: 0.15rem;
}

.new-service .svc-logo { height: 12px; }

.search-row {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 1.5rem;
}

.search-row .search-box {
    flex: 1;
}

.bell-btn {
    display: none;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    border-bottom: 1px solid var(--text);
    border-radius: 0;
    color: var(--text);
    padding: 0.7rem;
    cursor: pointer;
    position: relative;
    transition: border-color 0.2s, color 0.2s;
    flex-shrink: 0;
}

.bell-btn:hover {
    border-bottom-color: var(--accent);
    color: var(--accent);
}

.bell-plus {
    position: absolute;
    top: 3px;
    right: 3px;
    font-size: 0.55rem;
    font-weight: 700;
    background: var(--accent);
    color: var(--bg);
    width: 13px;
    height: 13px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
}

.alert-popup {
    margin-top: -0.75rem;
    margin-bottom: 1rem;
    padding: 1rem;
    border: 1px solid var(--text);
    border-radius: 12px;
}

.alert-popup-text {
    font-size: 0.85rem;
    margin-bottom: 0.75rem;
}

.alert-popup-form {
    display: flex;
    gap: 0.5rem;
}

.alert-popup-form input {
    flex: 1;
    padding: 0.6rem 0.8rem;
    font-family: 'Open Sans', sans-serif;
    font-size: 0.85rem;
    background: var(--bg);
    border: 1px solid var(--text);
    border-radius: 8px;
    color: var(--text);
    outline: none;
    min-width: 0;
}

.alert-popup-form input:focus {
    border-color: var(--accent);
}

.alert-popup-form input::placeholder { color: var(--text); opacity: 0.5; }

.alert-popup-form button {
    padding: 0.6rem 1.2rem;
    font-family: 'Open Sans', sans-serif;
    font-size: 0.85rem;
    background: var(--accent);
    color: var(--bg);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    white-space: nowrap;
}

.alert-popup-form button:disabled { opacity: 0.5; cursor: default; }

.alert-popup-msg {
    font-size: 0.85rem;
    margin-top: 0.6rem;
}

.alert-popup-msg.ok { color: var(--text); }
.alert-popup-msg.err { color: var(--accent); }

.bottom-section {
    margin-top: auto;
    transition: opacity 0.3s ease;
}

.container:not(.landing) .bottom-section {
    display: none;
}

@media (max-width: 600px) {
    .container { padding: 1rem; }
    header { gap: 0.5rem; }
    header img.logo { height: 36px; }
    header p { font-size: 0.8rem; }
    .card-image { display: none; }
    .new-card { flex: 0 0 140px; }
    .new-poster { width: 140px; height: 79px; }
    .alert-form { flex-direction: column; }
    .alert-popup-form { flex-direction: column; }
}
</style>
</head>
<body>
<div class="container landing" id="container">
    <header>
        <img class="logo" src="tvsearch_logo_dark.svg" alt="TVSearch UK">
        <p id="subtitle"></p>
    </header>

    <div class="search-area">
        <div class="search-row">
            <div class="search-box">
                <span class="icon">&#x2315;</span>
                <input type="text" id="searchInput" placeholder="Search titles&hellip;" autofocus disabled>
                <button type="button" class="clear-btn" id="clearBtn">ESC</button>
            </div>
            <button type="button" class="bell-btn" id="bellBtn" title="Get alerted for this search">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                </svg>
                <span class="bell-plus">+</span>
            </button>
        </div>
        <div class="alert-popup" id="alertPopup" style="display:none">
            <p class="alert-popup-text">We'll email you when new titles matching "<strong id="alertQueryText"></strong>" appear.</p>
            <form id="bellAlertForm" class="alert-popup-form">
                <input type="email" id="bellAlertEmail" placeholder="Your email" required>
                <button type="submit">Alert Me</button>
            </form>
            <p class="alert-popup-msg" id="bellAlertMsg" style="display:none"></p>
        </div>
    </div>

    <div class="new-this-week" id="newThisWeek">
        <h2>New This Week</h2>
        <div class="new-scroll"></div>
    </div>

    <div id="results">
        <div class="loading"><div class="spinner"></div><br>Loading catalogue&hellip;</div>
    </div>

    <div class="alert-section" id="alertSection">
        <p class="alert-heading">Can't find what you're looking for?</p>
        <form id="alertForm" class="alert-form">
            <input type="text" id="alertTitle" placeholder="Title to watch for" required>
            <input type="email" id="alertEmail" placeholder="Your email" required>
            <button type="submit" id="alertBtn">Alert Me</button>
        </form>
        <p class="alert-subtext">We'll email you when it appears on a free streaming service.</p>
        <p class="alert-msg" id="alertMsg" style="display:none"></p>
    </div>

    <div class="bottom-section">
        <div class="service-logos" id="serviceLogos"></div>
        <div class="footer">
            <a href="/privacy.html" style="color: var(--text); text-decoration: none; font-size: 0.75rem;">Privacy Policy</a>
        </div>
    </div>
</div>

<script>
const SERVICE_META = {
    bbc_iplayer:  { label: 'BBC iPlayer',  colour: '#e4134f', icon: 'images/iplayer.svg' },
    itvx:         { label: 'ITVX',          colour: '#00b2a9', icon: 'images/itvx.svg' },
    channel4:     { label: 'Channel 4',     colour: '#0d47a1', icon: 'images/channel4.svg' },
    channel5:     { label: 'Channel 5',     colour: '#6a1b9a', icon: 'images/channel5.svg' },
    tptv_encore:  { label: 'TPTV Encore',   colour: '#795548', icon: 'images/tptv.svg' },
    uktv_play:    { label: 'UKTV Play',     colour: '#e91e63', icon: 'images/uktv.svg' },
    rakuten_tv:   { label: 'Rakuten TV',    colour: '#bf0000', icon: 'images/rakuten.svg' },
    filmzie:      { label: 'Filmzie',        colour: '#00b4d8', icon: 'images/filmzie.svg' },
    wedotv:       { label: 'Wedotv',         colour: '#4caf50', icon: 'images/wedotv.svg' },
    pluto_tv_uk:  { label: 'Pluto TV UK',   colour: '#1a237e', icon: 'images/pluto.svg' },
    tubi:         { label: 'Tubi',           colour: '#ff6100', icon: 'images/tubi.svg' },
};

let catalogue = [];
let activeService = '';
const input = document.getElementById('searchInput');
const clearBtn = document.getElementById('clearBtn');
const resultsDiv = document.getElementById('results');
const logosDiv = document.getElementById('serviceLogos');
const subtitle = document.getElementById('subtitle');
const containerDiv = document.getElementById('container');
const bellBtn = document.getElementById('bellBtn');
const alertPopup = document.getElementById('alertPopup');
let debounceTimer;

// Load catalogue
fetch('catalogue.json')
    .then(r => r.json())
    .then(data => {
        catalogue = data;
        input.disabled = false;
        input.focus();

        // Count per service
        const counts = {};
        let total = 0;
        for (const item of data) {
            counts[item.service] = (counts[item.service] || 0) + 1;
            total++;
        }

        subtitle.textContent = total.toLocaleString() + ' films and shows free to stream now';

        // Build logo strip
        let logoHtml = '';
        for (const [svc, meta] of Object.entries(SERVICE_META)) {
            if (!counts[svc]) continue;
            logoHtml += '<img src="' + meta.icon + '" alt="' + meta.label + '">';
        }
        logosDiv.innerHTML = logoHtml;

        resultsDiv.innerHTML = '';

        // Check URL for initial query
        const params = new URLSearchParams(location.search);
        const q = params.get('q') || '';
        const svc = params.get('service') || '';
        if (q) {
            input.value = q;
            if (svc) activeService = svc;
            clearBtn.style.display = 'block';
            bellBtn.style.display = 'flex';
            doSearch();
        }
    })
    .catch(() => {
        resultsDiv.innerHTML = '<div class="no-results">Failed to load catalogue data.</div>';
    });

// New this week
const newSection = document.getElementById('newThisWeek');
fetch('new_this_week.json')
    .then(r => { if (!r.ok) throw new Error(); return r.json(); })
    .then(data => {
        if (!data || !data.length) return;
        const scroll = newSection.querySelector('.new-scroll');
        let html = '';
        for (const item of data) {
            const meta = SERVICE_META[item.service] || { label: item.service, icon: '' };
            const img = item.image_url || '';
            const logoImg = meta.icon ? '<img class="svc-logo" src="' + meta.icon + '" alt="">' : '';
            html += '<a class="new-card" href="' + escapeHtml(item.url || '#') + '" target="_blank" rel="noopener">'
                + '<div class="new-poster">'
                + (img ? '<img src="' + escapeHtml(img) + '" alt="' + escapeHtml(item.title) + '" loading="lazy">' : '')
                + '</div>'
                + '<div class="new-title">' + escapeHtml(item.title) + '</div>'
                + '<div class="new-service">' + logoImg + ' ' + meta.label + '</div>'
                + '</a>';
        }
        scroll.innerHTML = html;
        newSection.style.display = 'block';
    })
    .catch(() => {});

// Search
input.addEventListener('input', () => {
    clearBtn.style.display = input.value ? 'block' : 'none';
    bellBtn.style.display = input.value.trim().length >= 2 ? 'flex' : 'none';
    alertPopup.style.display = 'none';
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => { doSearch(); updateURL(); }, 150);
});

function doSearch() {
    const q = input.value.trim().toLowerCase();
    if (q.length < 2) {
        containerDiv.classList.add('landing');
        resultsDiv.innerHTML = '';
        if (newSection.querySelector('.new-scroll').children.length) newSection.style.display = 'block';
        return;
    }
    containerDiv.classList.remove('landing');
    newSection.style.display = 'none';

    let matches = catalogue.filter(item => {
        if (activeService && item.service !== activeService) return false;
        return item.title.toLowerCase().includes(q);
    });

    if (matches.length > 200) matches = matches.slice(0, 200);

    if (matches.length === 0) {
        resultsDiv.innerHTML = '<div class="no-results">No matches found.</div>';
        return;
    }

    let html = '<div class="results-count">' + matches.length + ' result' + (matches.length !== 1 ? 's' : '') + '</div>';
    let currentSvc = null;

    for (const r of matches) {
        const meta = SERVICE_META[r.service] || { label: r.service, colour: '#666', icon: '' };

        if (r.service !== currentSvc) {
            if (currentSvc !== null) html += '</div>';
            currentSvc = r.service;
            const logoHtml = meta.icon ? '<img class="svc-logo" src="' + meta.icon + '" alt=""> ' : '';
            html += '<div class="service-group"><div class="service-header" style="--svc-colour: ' + meta.colour + '">'
                + logoHtml + meta.label + '</div>';
        }

        // Highlight match
        const title = escapeHtml(r.title);
        const titleLower = title.toLowerCase();
        const idx = titleLower.indexOf(q);
        let titleDisplay = title;
        if (idx >= 0) {
            titleDisplay = title.substring(0, idx)
                + '<mark>' + title.substring(idx, idx + q.length) + '</mark>'
                + title.substring(idx + q.length);
        }

        const desc = escapeHtml((r.description || '').substring(0, 200));
        const url = r.url || '#';
        const imgHtml = r.image_url
            ? '<img src="' + escapeHtml(r.image_url) + '" alt="" loading="lazy" onerror="this.style.display=\'none\'">'
            : '';

        html += '<a class="result-card" href="' + escapeHtml(url) + '" target="_blank" rel="noopener">'
            + '<div class="card-image">' + imgHtml + '</div>'
            + '<div class="card-body">'
            + '<div class="card-title">' + titleDisplay + '</div>'
            + '<div class="card-desc">' + desc + '</div>'
            + '</div>'
            + '<div class="card-arrow">→</div>'
            + '</a>';
    }
    if (currentSvc !== null) html += '</div>';

    resultsDiv.innerHTML = html;
}

function updateURL() {
    const q = input.value.trim();
    const params = new URLSearchParams();
    if (q) params.set('q', q);
    if (activeService) params.set('service', activeService);
    const url = params.toString() ? '?' + params.toString() : location.pathname;
    history.replaceState(null, '', url);
}

function clearSearch() {
    input.value = '';
    activeService = '';
    clearBtn.style.display = 'none';
    bellBtn.style.display = 'none';
    alertPopup.style.display = 'none';
    resultsDiv.innerHTML = '';
    containerDiv.classList.add('landing');
    if (newSection.querySelector('.new-scroll').children.length) newSection.style.display = 'block';
    history.replaceState(null, '', location.pathname);
    input.focus();
}

function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
}

clearBtn.addEventListener('click', clearSearch);

bellBtn.addEventListener('click', () => {
    if (alertPopup.style.display === 'none' || !alertPopup.style.display) {
        document.getElementById('alertQueryText').textContent = input.value.trim();
        document.getElementById('bellAlertMsg').style.display = 'none';
        document.getElementById('bellAlertForm').style.display = 'flex';
        alertPopup.style.display = 'block';
        document.getElementById('bellAlertEmail').focus();
    } else {
        alertPopup.style.display = 'none';
    }
});

document.addEventListener('keydown', (e) => {
    if (e.key === '/' && document.activeElement !== input) {
        e.preventDefault();
        input.focus();
    }
    if (e.key === 'Escape') clearSearch();
});
